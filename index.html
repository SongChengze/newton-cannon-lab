<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>牛顿大炮·离线实验室</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06101c;color:#eaf5ff;font-family:"Microsoft YaHei",sans-serif}.app{min-height:100vh;padding:20px;background:radial-gradient(circle at 20% 0,#10314c,transparent 36%)}header{height:72px;border-bottom:1px solid #254963;display:flex;align-items:center;justify-content:space-between}h1{font-size:25px;margin:4px 0}.ey{color:#56ddf5;font-size:11px;letter-spacing:.2em}.state{border:1px solid #254963;border-radius:30px;padding:9px 15px}.grid{display:grid;grid-template-columns:1fr 355px;gap:16px;padding:16px 0}.stage{height:calc(100vh - 185px);min-height:530px;border:1px solid #254963;border-radius:18px;overflow:hidden;position:relative;touch-action:none}.stage canvas{display:block;width:100%;height:100%}.question{position:absolute;left:18px;top:18px;background:#071522dd;border:1px solid #31566d;border-radius:12px;padding:12px}.question small{display:block;color:#56ddf5;margin-bottom:5px}.panel{display:flex;flex-direction:column;gap:10px}.card{background:linear-gradient(145deg,#0f273a,#081927);border:1px solid #254963;border-radius:15px;padding:16px}.card h2{font-size:13px;letter-spacing:.12em;color:#a9c4d8;margin:0 0 14px}.card label{display:flex;justify-content:space-between;font-size:12px;color:#a9bccb;margin:12px 0 5px}input[type=range]{width:100%;accent-color:#56ddf5}.buttons{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-top:14px}button{background:#102c40;color:#dceefa;border:1px solid #31566d;border-radius:9px;padding:9px;cursor:pointer}.primary{background:#56ddf5;color:#05202d;font-weight:bold}.mode{width:100%;margin-top:12px;border-color:#56ddf5;color:#9cecff}.mode.point{background:#2c2441;border-color:#bd8cff;color:#eadcff}.checks{justify-content:flex-start!important;gap:8px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metrics div{background:#071827;padding:10px;border-radius:9px}.metrics small{display:block;color:#8da7bd}.metrics b{font-size:20px}.timeQuick{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}.timeQuick button{padding:6px 2px;font-size:10px}.timeQuick button.active{background:#1c536b;border-color:#56ddf5;color:#fff}.result{border-left:2px solid #56ddf5;background:#0a2234;padding:9px;font-size:12px}.formula{display:grid;grid-template-columns:60px 1fr auto;padding:9px 0;border-bottom:1px solid #1f3c51;font-size:12px}.formula output{color:#ffd45c;font-weight:bold}.note{font-size:11px;color:#91aabc;line-height:1.6}.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.quick button{font-size:11px}.quick b{color:#ffd45c;display:block;font-size:15px}.zoom{position:absolute;right:16px;bottom:16px;display:grid;grid-template-columns:42px 42px auto;gap:7px;align-items:center;background:#071522e8;border:1px solid #31566d;border-radius:12px;padding:7px}.zoom button{height:38px;padding:0;font-size:22px;font-weight:bold}.zoom .fit{font-size:11px;padding:0 10px;font-weight:normal}.zoom output{grid-column:1/-1;text-align:center;color:#91b6cd;font-size:10px}@media(max-width:900px){.grid{grid-template-columns:1fr}.stage{height:60vh}.quick{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="app"><header><div><div class="ey">GRAVITY LAB · 解析开普勒引擎</div><h1>牛顿大炮 — 地球为什么“弯”开了？</h1></div><div class="state" id="state">待发射</div></header><section class="grid"><div class="stage"><canvas id="cv"></canvas><div class="question"><small>核心问题</small><b>水平抛出的物体，速度多大时不再落回地面？</b></div></div><aside class="panel"><div class="card"><h2>发射控制台</h2><label>发射高度 <output id="ho">120 km</output></label><input id="height" type="range" min="10" max="800" step="10" value="120"><label>水平速度 <output id="vo">7.91 km/s</output></label><input id="speed" type="range" min="1" max="12.5" step=".01" value="7.91"><div class="buttons"><button class="primary" id="launch">发射</button><button id="pause">暂停</button><button id="reset">复位</button></div><button class="mode" id="mode">切换为质点地球（允许穿入）</button><label class="checks"><input id="vectors" type="checkbox" checked>显示速度与引力矢量</label></div><div class="card"><h2>实时数据</h2><div class="metrics"><div><small>飞行时间</small><b id="clock">0:00</b></div><div><small>时间倍率</small><b id="tso">20×</b></div></div><input id="ts" type="range" min="1" max="2000" step="1" value="20"><div class="timeQuick" id="timeQuick"><button data-time="1">1×</button><button class="active" data-time="20">20×</button><button data-time="100">100×</button><button data-time="500">500×</button><button data-time="2000">2000×</button></div><p class="result" id="result">调整参数，作出预测，再发射验证。</p></div><div class="card"><h2>临界速度</h2><div class="formula"><span>圆轨道</span><b>v₁=√(GM/r)</b><output id="vc"></output></div><div class="formula"><span>逃逸</span><b>v₂=√(2GM/r)</b><output id="ve"></output></div><p class="note" id="modeNote">真实地球模式：解析轨道首次触及地表时停止。</p></div><div class="quick" id="quick"></div></aside></section></main>
<script>
(()=>{
const R=6371,MU=398600.4418,TAU=Math.PI*2,$=id=>document.getElementById(id),cv=$("cv"),ctx=cv.getContext("2d"),stage=cv.parentElement;
const s={t:0,trail:[],run:false,crash:false,orbit:null,pos:null,nextSample:0,closedShown:false};let last=performance.now(),zoom=1,pinchDistance=0,pointMode=false;
const presets=[["低速落地",4.5],["落得更远",6.5],["第一宇宙速度",7.91],["椭圆轨道",9.2],["第二宇宙速度",11.19]];$("quick").innerHTML=presets.map((p,i)=>'<button data-i="'+i+'"><b>'+p[1].toFixed(2)+'</b>'+p[0]+'</button>').join("");
const zoomBox=document.createElement("div");zoomBox.className="zoom";zoomBox.innerHTML='<button id="zin">＋</button><button id="zout">−</button><button class="fit" id="zfit">恢复视野</button><output id="zo">100% · 滚轮缩放</output>';stage.appendChild(zoomBox);
function setZoom(v){zoom=Math.max(.35,Math.min(4,v));$("zo").textContent=Math.round(zoom*100)+"% · 滚轮缩放"}$("zin").onclick=()=>setZoom(zoom*1.25);$("zout").onclick=()=>setZoom(zoom/1.25);$("zfit").onclick=()=>setZoom(1);stage.addEventListener("wheel",e=>{e.preventDefault();setZoom(zoom*(e.deltaY<0?1.12:.89))},{passive:false});stage.addEventListener("touchstart",e=>{if(e.touches.length===2)pinchDistance=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});stage.addEventListener("touchmove",e=>{if(e.touches.length!==2||!pinchDistance)return;e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);setZoom(zoom*d/pinchDistance);pinchDistance=d},{passive:false});stage.addEventListener("touchend",()=>pinchDistance=0);
function solveE(M,e){M=((M+Math.PI)%TAU+TAU)%TAU-Math.PI;let E=M+e*Math.sin(M);for(let i=0;i<15;i++){const q=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));E-=q;if(Math.abs(q)<1e-12)break}return E}
function solveH(M,e){let H=Math.asinh(M/e);for(let i=0;i<18;i++){const q=(e*Math.sinh(H)-H-M)/(e*Math.cosh(H)-1);H-=q;if(Math.abs(q)<1e-12)break}return H}
function solveD(q){let D=Math.cbrt(3*q);for(let i=0;i<15;i++){const z=(D+D*D*D/3-q)/(1+D*D);D-=z;if(Math.abs(z)<1e-12)break}return D}
function makeOrbit(r0,v){
 const vc=Math.sqrt(MU/r0),energy=v*v/2-MU/r0,h=r0*v;
 if(Math.abs(v-vc)<1e-10){const n=Math.sqrt(MU/r0**3),period=TAU/n;return{kind:"circle",r0,v,vc,period,sample:period/2400,stateAt(t){const a=n*t;return{x:r0*Math.sin(a),y:r0*Math.cos(a),vx:r0*n*Math.cos(a),vy:-r0*n*Math.sin(a)}}}}
 if(Math.abs(energy)<1e-7){const k=Math.sqrt(2*r0**3/MU);return{kind:"parabola",r0,v,vc,sample:1,stateAt(t){const D=solveD(t/k),dD=1/(k*(1+D*D)),xp=r0*(1-D*D),yp=2*r0*D;return{x:yp,y:xp,vx:2*r0*dD,vy:-2*r0*D*dD}}}}
 if(energy<0){const a=-MU/(2*energy),e=Math.sqrt(Math.max(0,1+2*energy*h*h/MU**2)),n=Math.sqrt(MU/a**3),period=TAU/n,sign=v>vc?1:-1,M0=sign>0?0:Math.PI,sq=Math.sqrt(Math.max(0,1-e*e));return{kind:"ellipse",r0,v,vc,a,e,period,sample:period/5000,stateAt(t){const E=solveE(M0+n*t,e),dE=n/(1-e*Math.cos(E)),xp=a*(Math.cos(E)-e),yp=a*sq*Math.sin(E),vxp=-a*Math.sin(E)*dE,vyp=a*sq*Math.cos(E)*dE;return{x:sign*yp,y:sign*xp,vx:sign*vyp,vy:sign*vxp}}}}
 const a=MU/(2*energy),e=Math.sqrt(1+2*energy*h*h/MU**2),n=Math.sqrt(MU/a**3),sq=Math.sqrt(e*e-1);return{kind:"hyperbola",r0,v,vc,a,e,sample:1,stateAt(t){const H=solveH(n*t,e),dH=n/(e*Math.cosh(H)-1),xp=a*(e-Math.cosh(H)),yp=a*sq*Math.sinh(H),vxp=-a*Math.sinh(H)*dH,vyp=a*sq*Math.cosh(H)*dH;return{x:yp,y:xp,vx:vyp,vy:vxp}}}
}
function impactTime(o){if(pointMode||o.kind!=="ellipse"||o.v>=o.vc)return Infinity;const p=o.stateAt(o.period/2);if(Math.hypot(p.x,p.y)>=R)return Infinity;let lo=0,hi=o.period/2;for(let i=0;i<60;i++){const m=(lo+hi)/2,q=o.stateAt(m);Math.hypot(q.x,q.y)>R?lo=m:hi=m}return hi}
function vals(){const h=+$("height").value,v=+$("speed").value,r=R+h,vc=Math.sqrt(MU/r),ve=Math.sqrt(2*MU/r);$("ho").textContent=h+" km";$("vo").textContent=v.toFixed(2)+" km/s";$("vc").textContent=vc.toFixed(2)+" km/s";$("ve").textContent=ve.toFixed(2)+" km/s";$("result").textContent=Math.abs(v-vc)<.08?"近似圆轨道：万有引力提供向心力":v<vc?(pointMode?"解析椭圆：轨迹将穿入虚线范围":"速度不足：解析轨道将与地表相交"):v<ve?"椭圆轨道：仍被地球引力束缚":"达到或超过逃逸速度"}
function reset(run=false,v=+$("speed").value){s.orbit=makeOrbit(R+ +$("height").value,v);s.impact=impactTime(s.orbit);s.t=0;s.pos=s.orbit.stateAt(0);s.trail=[{...s.pos,t:0}];s.nextSample=s.orbit.sample;s.run=run;s.crash=false;s.closedShown=false;$("state").textContent=run?"飞行中":"待发射";$("clock").textContent="0:00"}
function arrow(x1,y1,x2,y2,c,t){const a=Math.atan2(y2-y1,x2-x1);ctx.strokeStyle=ctx.fillStyle=c;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-8*Math.cos(a-.5),y2-8*Math.sin(a-.5));ctx.lineTo(x2-8*Math.cos(a+.5),y2-8*Math.sin(a+.5));ctx.fill();ctx.font="12px sans-serif";ctx.fillText(t,x2+4,y2)}
function draw(){const d=Math.min(devicePixelRatio,2),w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}ctx.setTransform(d,0,0,d,0,0);const g=ctx.createRadialGradient(w*.5,h*.5,0,w*.5,h*.5,w*.7);g.addColorStop(0,"#102b46");g.addColorStop(1,"#06101e");ctx.fillStyle=g;ctx.fillRect(0,0,w,h);const sc=Math.min(w,h)*.43/(R*1.55)*zoom,cx=w*.48,cy=h*.52,map=p=>({x:cx+p.x*sc,y:cy-p.y*sc}),earth=map({x:0,y:0});if(s.trail.length){ctx.beginPath();s.trail.forEach((p,i)=>{const q=map(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.strokeStyle="#56ddf5";ctx.lineWidth=2;ctx.stroke()}ctx.beginPath();ctx.arc(earth.x,earth.y,R*sc,0,TAU);if(pointMode){ctx.setLineDash([9,7]);ctx.strokeStyle="#a88bd8";ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(earth.x,earth.y,5,0,TAU);ctx.fillStyle="#d6b7ff";ctx.fill();ctx.font="12px sans-serif";ctx.fillStyle="#cbb8e8";ctx.fillText("全部质量集中于地心",earth.x+10,earth.y-10)}else{ctx.fillStyle="#1473a8";ctx.fill();ctx.strokeStyle="#77d7f2";ctx.stroke()}const q=map(s.pos);ctx.beginPath();ctx.arc(q.x,q.y,6,0,TAU);ctx.fillStyle=s.crash?"#ff6b5f":"#ffd45c";ctx.fill();if($("vectors").checked&&!s.crash){arrow(q.x,q.y,q.x+s.pos.vx*8,q.y-s.pos.vy*8,"#ffd45c","v");const rr=Math.max(Math.hypot(s.pos.x,s.pos.y),1);arrow(q.x,q.y,q.x-s.pos.x/rr*48,q.y+s.pos.y/rr*48,"#ff7b70","F引")}}
function addTrail(to){while(s.nextSample<=to){const p=s.orbit.stateAt(s.nextSample);s.trail.push({...p,t:s.nextSample});s.nextSample+=s.orbit.sample}if(s.trail.length>5200)s.trail.splice(0,s.trail.length-5200)}
function frame(now){if(s.run){const target=s.t+Math.min((now-last)/1000,.05)*(+$("ts").value);if(target>=s.impact){addTrail(s.impact);s.t=s.impact;s.pos=s.orbit.stateAt(s.t);s.run=false;s.crash=true;$("state").textContent="撞击地表";$("result").textContent="解析轨道在此时首次与地表相交"}else{s.t=target;addTrail(s.t);s.pos=s.orbit.stateAt(s.t);const r=Math.hypot(s.pos.x,s.pos.y);if(r>R*6&&s.pos.x*s.pos.vx+s.pos.y*s.pos.vy>0){s.run=false;$("state").textContent="逃逸地球";$("result").textContent="机械能不小于零，物体不再返回"}else if(pointMode&&s.orbit.period&&!s.closedShown&&s.t>=s.orbit.period){s.closedShown=true;$("state").textContent="闭合轨道";$("result").textContent="解析开普勒解：一周后严格回到同一条轨道"}}$("clock").textContent=Math.floor(s.t/60)+":"+String(Math.floor(s.t%60)).padStart(2,"0")}last=now;draw();requestAnimationFrame(frame)}
function setTime(v){$("ts").value=v;$("tso").textContent=v+"×";document.querySelectorAll("#timeQuick button").forEach(b=>b.classList.toggle("active",+b.dataset.time===+v))}
$("height").oninput=()=>{vals();reset()};$("speed").oninput=vals;$("ts").oninput=()=>setTime($("ts").value);$("timeQuick").onclick=e=>{const b=e.target.closest("button");if(b)setTime(b.dataset.time)};$("launch").onclick=()=>reset(true);$("reset").onclick=()=>reset();$("pause").onclick=()=>{s.run=!s.run;$("state").textContent=s.run?"飞行中":"已暂停"};$("mode").onclick=()=>{pointMode=!pointMode;$("mode").classList.toggle("point",pointMode);$("mode").textContent=pointMode?"切换为真实地球（碰撞停止）":"切换为质点地球（允许穿入）";$("modeNote").textContent=pointMode?"质点地球模式：解析开普勒轨道；虚线仅表示原地球范围。":"真实地球模式：解析轨道首次触及地表时停止。";reset();vals();$("result").textContent=pointMode?"质点地球已启用：椭圆轨道不会因数值误差逐圈缩小。":"真实地球已启用：解析计算首次触地时刻。"};$("quick").onclick=e=>{const b=e.target.closest("button");if(!b)return;const v=presets[+b.dataset.i][1];$("speed").value=v;vals();reset(true,v)};vals();reset();requestAnimationFrame(frame);
})();
</script></body></html>
